
      - name: Locate or extract NERF SCORE project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "package.json" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Aucun fichier ZIP trouvé."
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted

            PACKAGE_FILE="$(find extracted -type f -name package.json -print -quit)"
            if [ -z "$PACKAGE_FILE" ]; then
              echo "::error::package.json introuvable."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet détecté : $PROJECT_DIR"

          test -f "$PROJECT_DIR/capacitor.config.ts" || {
            echo "::error::capacitor.config.ts absent."
            exit 1
          }
