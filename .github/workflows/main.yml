
name: Build NERF SCORE APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extraire le projet ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Fichier ZIP introuvable"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name package.json -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Installer les dépendances
        run: cd "$PROJECT_DIR" && npm install

      - name: Construire Android
        run: |
          cd "$PROJECT_DIR"
          npm run build
          npx cap add android
          npx cap sync android

      - name: Générer APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Télécharger le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: NERF-SCORE-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
